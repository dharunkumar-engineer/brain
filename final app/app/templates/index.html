<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dk's Tumor Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body {
            font-family: 'Arial', sans-serif;
                background: url('https://images.newscientist.com/wp-content/uploads/2018/06/15100753/gettyimages-168715138.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff; /* White color for text */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 400px; /* Reduced size */
            margin: 0 auto;
            flex: 1;
        }

        .card {
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.15); /* Slight transparency */
            backdrop-filter: blur(10px);
            color: #ffffff; /* White color for card text */
            border: none;
        }

        .text-center {
            text-align: center;
            color: #ffffff; /* White color for text in center */
        }

        .text-center h1 {
            font-size: 2rem; /* Reduced font size */
            font-weight: bold; /* Bold text */
            color: #ffffff; /* White color for font */
            display: inline-block; /* Inline block to fit content */
            padding: 5px; /* Padding for better appearance */
        }

        .btn {
            width: 100%;
            background-color: #ff7eb3;
            border: none;
            color: #ffffff; /* White color for button text */
        }

        .btn:hover {
            background-color: #ff5585;
        }

        .lead {
            margin-bottom: 20px; /* Reduced margin */
            color: #ffffff; /* White color for lead text */
        }

        #results img {
            max-height: 300px; /* Reduced size */
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.3);
        }

        /* Footer Styling */
        .footer {
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="text-center">
            <h1 class="display-4">Brain Tumor Detection</h1>
            <p class="lead">Upload an MRI image to detect if there is a tumor and its type.</p>
        </div>

        <!-- File Upload Form -->
        <div class="card shadow p-4 mt-4">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="file" class="form-label">Select MRI Image:</label>
                    <input type="file" class="form-control" id="file" name="file" accept="image/*" required>
                </div>
                <button type="submit" class="btn">Upload and Detect</button>
            </form>
        </div>

        {% if result %}
        <!-- Display Results -->
        <div id="results" class="mt-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h4 class="card-title">{{ result }}</h4>
                    <p class="card-text">Confidence: {{ confidence }}</p>
                    <div class="text-center">
                        <img src="{{ file_path }}" class="img-fluid" alt="Uploaded Image">
                    </div>
                </div>
            </div>
        </div>
        {% endif %}
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Brain Tumor Detection. All Rights Reserved.</p>
        </p> Team IT 43 Parul University </p>
    </footer>
</body>
</html>
